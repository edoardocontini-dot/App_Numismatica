name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk numismatica.apk

      - uses: actions/upload-artifact@v4
        with:
          name: numismatica-apk
          path: numismatica.apk

      # Publishes the APK so it can be downloaded from the phone at
      # https://github.com/<owner>/<repo>/releases/latest/download/numismatica.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Numismatica 1.0.${{ github.run_number }}
          files: numismatica.apk
          make_latest: true
